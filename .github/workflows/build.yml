name: Build DM Valdorana

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installa le dipendenze (fino a 3 tentativi)
        shell: bash
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "Tentativo $i non riuscito (rete), nuovo tentativo tra 30 secondi"; sleep 30
          done
          test -d node_modules/electron/dist
      - name: Compila l'installer
        run: npx electron-builder --win --publish never
      - name: Allega l'installer alla Release (aggiornamenti automatici)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - uses: actions/upload-artifact@v6
        with:
          name: DM-Valdorana-installer
          path: dist/*.exe
